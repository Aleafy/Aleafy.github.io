name: Refresh Google Scholar citations

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate Scholar total
        run: python google_scholar_crawler/update_citations.py
      - name: Save verified snapshot
        run: |
          git add _data/scholar.json assets/data/scholar.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Google Scholar citation snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
